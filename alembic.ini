[alembic]
script_location = alembic
prepend_sys_path = .

# Left blank deliberately — alembic/env.py sets the real URL by reusing
# infrastructure/db/session.py's engine (itself driven by DATABASE_URL),
# so the connection string doesn't need to be duplicated, and kept in
# sync, in this file too.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
